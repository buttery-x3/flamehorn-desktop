<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">B3 Process-output destination creation palette, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#d8dce0" stroke="#d8dce0" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#e0e4e8" stroke="#b1bac5" stroke-width="1"/><text x="13" y="21" fill="#29333e" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#616d7b" font-size="11" font-weight="400">Drag the Process output / create destination</text><text x="1130" y="21" fill="#616d7b" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#616d7b" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#eceef0" stroke="#b1bac5" stroke-width="1"/><text x="15" y="52" fill="#616d7b" font-size="11" font-weight="400">Desktop  /  Drag the Process output / create destination</text><text x="475" y="52" fill="#616d7b" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#e0e4e8" stroke="#b1bac5" stroke-width="1"/><text x="14" y="821" fill="#616d7b" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#616d7b" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1014" height="705" rx="3" fill="#e5e8eb" stroke="none" stroke-width="1"/><path d="M28 102 L1022 102" fill="none" stroke="#b8c1cb" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#616d7b" font-size="10" font-weight="400">CONVERSATION WORKSPACE  /  Story seeds</text><text x="1002" y="94" fill="#616d7b" font-size="12" font-weight="400">⋯</text><text x="40" y="733" fill="#29333e" font-size="12" font-weight="600">B3  Drag the Process output / create destination</text><rect x="37" y="160" width="268" height="187" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M45 186 L297 186" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="46" y="178" fill="#29333e" font-size="12" font-weight="600">U1  User Context</text><text x="239" y="178" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="44" y="192" width="254" height="123" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="52" y="211" fill="#29333e" font-size="13" font-weight="400">Why do abandoned places feel full</text><text x="52" y="229" fill="#29333e" font-size="13" font-weight="400">of stories?</text><text x="52" y="247" fill="#29333e" font-size="13" font-weight="400"></text><text x="52" y="265" fill="#29333e" font-size="13" font-weight="400">Start with the emotional feeling,</text><text x="52" y="283" fill="#29333e" font-size="13" font-weight="400">then look at the objects we leave…</text><text x="47" y="336" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="247" y="336" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="33" y="203" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="301" y="203" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M305 207 C329.5 207 329.5 240 354 240" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M347 237 L354 240 L347 243" fill="none" stroke="#1483b7"/><rect x="354" y="177" width="230" height="146" rx="9" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="366" y="197" fill="#29333e" font-size="13" font-weight="600">Respond</text><text x="366" y="214" fill="#616d7b" font-size="9" font-weight="400">P1  PROCESS</text><text x="545" y="203" fill="#29333e" font-size="17" font-weight="400">∅</text><text x="567" y="202" fill="#616d7b" font-size="10" font-weight="400">⌄</text><text x="369" y="241" fill="#616d7b" font-size="11" font-weight="400">Tone</text><text x="453" y="241" fill="#29333e" font-size="12" font-weight="400">Reflective  ⌄</text><path d="M366 286 L572 286" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="370" y="276" fill="#616d7b" font-size="11" font-weight="400">1 input → 0 targets</text><rect x="362" y="292" width="110" height="23" rx="3" fill="#e0e4e8" stroke="none" stroke-width="1"/><text x="371" y="308" fill="#29333e" font-size="11" font-weight="400">Run unavailable</text><text x="519" y="308" fill="#616d7b" font-size="10" font-weight="400">No output</text><rect x="350" y="236" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="580" y="236" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M584 240 L650 240" fill="none" stroke="#b67a0b" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="654" y="209" width="348" height="91" rx="2" fill="#eceef0" stroke="#b1bac5" stroke-width="1"/><rect x="662" y="217" width="332" height="27" rx="1" fill="#fff" stroke="#0875b9" stroke-width="1"/><text x="671" y="236" fill="#616d7b" font-size="12" font-weight="400">Create output destination…</text><rect x="658" y="250" width="340" height="23" rx="0" fill="#d3e7f6" stroke="none" stroke-width="1"/><text x="669" y="266" fill="#29333e" font-size="12" font-weight="400">Model Context</text><path d="M44 472 L991 472" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="44" y="496" fill="#29333e" font-size="11" font-weight="600">Create a destination separately.</text><text x="44" y="520" fill="#616d7b" font-size="13" font-weight="400">Choosing Model Context makes an empty connected destination. Generation remains a separate explicit action.</text><rect x="1050" y="77" width="290" height="705" rx="0" fill="#eceef0" stroke="none" stroke-width="1"/><text x="1064" y="99" fill="#29333e" font-size="11" font-weight="600">REVIEW NOTES</text><path d="M1062 111 L1328 111" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="1064" y="138" fill="#29333e" font-size="11" font-weight="600">Second gesture</text><text x="1064" y="162" fill="#616d7b" font-size="12" font-weight="400">Drag from the Process’s amber output pin.</text><text x="1064" y="253" fill="#29333e" font-size="11" font-weight="600">Destination meaning</text><text x="1064" y="277" fill="#616d7b" font-size="12" font-weight="400">The new Model Context is a place for</text><text x="1064" y="295" fill="#616d7b" font-size="12" font-weight="400">output, not a prompt-intention node.</text><text x="1064" y="368" fill="#29333e" font-size="11" font-weight="600">No automatic run</text><text x="1064" y="392" fill="#616d7b" font-size="12" font-weight="400">Adding a connection never authorises</text><text x="1064" y="410" fill="#616d7b" font-size="12" font-weight="400">execution.</text></g></svg>