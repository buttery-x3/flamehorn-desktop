<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">W4 reference nodes with independent attachment checkbox and direct Process wiring, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#181a1e" stroke="#181a1e" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="13" y="21" fill="#dedfe3" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#a2a9b3" font-size="11" font-weight="400">References / attachment selection and direct input</text><text x="1130" y="21" fill="#a2a9b3" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#a2a9b3" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#25282e" stroke="#454c57" stroke-width="1"/><text x="15" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Desktop  /  References / attachment selection and direct input</text><text x="475" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="14" y="821" fill="#a2a9b3" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#a2a9b3" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1320" height="705" rx="3" fill="#202328" stroke="none" stroke-width="1"/><path d="M28 102 L1328 102" fill="none" stroke="#343b44" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#a2a9b3" font-size="10" font-weight="400">CONVERSATION WORKSPACE / wiring is explicit; attachment scope is not settled</text><text x="1308" y="94" fill="#a2a9b3" font-size="12" font-weight="400">⋯</text><rect x="45" y="140" width="309" height="178" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><text x="55" y="159" fill="#dedfe3" font-size="12" font-weight="600">F1  station.png</text><path d="M53 167 L346 167" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><rect x="52" y="173" width="295" height="113" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><rect x="60" y="180" width="65" height="98" rx="0" fill="#202328" stroke="none" stroke-width="1"/><path d="M65 271 L112 185 M77 271 L117 185" fill="none" stroke="#a2a9b3" stroke-width="1" stroke-dasharray=""/><text x="135" y="192" fill="#a2a9b3" font-size="11" font-weight="400">Image preview · an empty station</text><text x="135" y="208" fill="#a2a9b3" font-size="11" font-weight="400">platform.</text><rect x="55" y="296" width="11" height="11" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><text x="73" y="306" fill="#dedfe3" font-size="10" font-weight="400">Include as context attachment</text><rect x="350" y="183" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><rect x="45" y="390" width="309" height="200" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M53 416 L346 416" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="54" y="408" fill="#dedfe3" font-size="12" font-weight="600">U1  User Context</text><text x="288" y="408" fill="#a2a9b3" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="52" y="422" width="295" height="136" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="60" y="441" fill="#dedfe3" font-size="13" font-weight="400">Why do abandoned places feel full of</text><text x="60" y="459" fill="#dedfe3" font-size="13" font-weight="400">stories?</text><text x="60" y="477" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="60" y="495" fill="#dedfe3" font-size="13" font-weight="400">Start with the emotional feeling, then look</text><text x="60" y="513" fill="#dedfe3" font-size="13" font-weight="400">at the objects we leave behind.</text><text x="55" y="579" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="296" y="579" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="41" y="433" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="350" y="433" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><path d="M354 187 L421 187 L421 286 L493 286" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M486 283 L493 286 L486 289" fill="none" stroke="#56b8e9"/><path d="M354 437 L448 437 L448 325 L493 325" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M486 322 L493 325 L486 328" fill="none" stroke="#56b8e9"/><rect x="493" y="223" width="260" height="166" rx="9" fill="#292d33" stroke="#318bd4" stroke-width="1.4"/><text x="505" y="243" fill="#dedfe3" font-size="13" font-weight="600">Respond</text><text x="505" y="260" fill="#a2a9b3" font-size="9" font-weight="400">P1  PROCESS</text><text x="714" y="249" fill="#dedfe3" font-size="17" font-weight="400">∅</text><text x="736" y="248" fill="#a2a9b3" font-size="10" font-weight="400">⌄</text><text x="508" y="287" fill="#a2a9b3" font-size="11" font-weight="400">Tone</text><text x="592" y="287" fill="#dedfe3" font-size="12" font-weight="400">Reflective  ⌄</text><path d="M505 352 L741 352" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="509" y="342" fill="#a2a9b3" font-size="11" font-weight="400">2 inputs → 1 target</text><rect x="501" y="358" width="70" height="23" rx="3" fill="#073f64" stroke="none" stroke-width="1"/><text x="510" y="374" fill="#dedfe3" font-size="11" font-weight="400">▶ Run</text><text x="688" y="374" fill="#a2a9b3" font-size="10" font-weight="400">Ready</text><rect x="489" y="282" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="749" y="282" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><rect x="489" y="321" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><path d="M753 286 C819.5 286 819.5 286 886 286" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M879 283 L886 286 L879 289" fill="none" stroke="#56b8e9"/><rect x="886" y="239" width="413" height="237" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M894 265 L1291 265" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="895" y="257" fill="#dedfe3" font-size="12" font-weight="600">M10  Model Context</text><text x="1233" y="257" fill="#a2a9b3" font-size="11" font-weight="400">‹ — ›</text><rect x="893" y="271" width="399" height="173" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="901" y="290" fill="#dedfe3" font-size="13" font-weight="400">Awaiting first run.</text><text x="901" y="308" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="901" y="326" fill="#dedfe3" font-size="13" font-weight="400">The two visible wires supply U1 and the station image to</text><text x="901" y="344" fill="#dedfe3" font-size="13" font-weight="400">Respond.</text><text x="901" y="362" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="901" y="380" fill="#dedfe3" font-size="13" font-weight="400">The separate attachment selection is illustrated below; its</text><text x="901" y="398" fill="#dedfe3" font-size="13" font-weight="400">target scope remains open.</text><text x="896" y="465" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="1241" y="465" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="882" y="282" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="1295" y="282" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><rect x="474" y="509" width="326" height="136" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><text x="484" y="528" fill="#dedfe3" font-size="12" font-weight="600">F2  field-notes.txt</text><path d="M482 536 L792 536" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><rect x="481" y="542" width="312" height="71" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="489" y="562" fill="#a2a9b3" font-size="11" font-weight="400">A bench worn smooth by years of waiting.</text><rect x="484" y="623" width="11" height="11" rx="0" fill="#073f64" stroke="#318bd4" stroke-width="1"/><path d="M486 628 L489 631 L493 625" fill="none" stroke="#dedfe3" stroke-width="1.4" stroke-dasharray=""/><text x="502" y="633" fill="#dedfe3" font-size="10" font-weight="400">Include as context attachment</text><rect x="796" y="552" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><text x="45" y="344" fill="#a2a9b3" font-size="11" font-weight="400">Unchecked attachment box ≠ excluded wired input</text><text x="888" y="521" fill="#a2a9b3" font-size="12" font-weight="400">F2 is checked as a context attachment, with no wire drawn.</text><text x="888" y="541" fill="#a2a9b3" font-size="12" font-weight="400"></text><text x="888" y="561" fill="#a2a9b3" font-size="12" font-weight="400">The checkbox does not add or remove a Process wire. Its target</text><text x="888" y="581" fill="#a2a9b3" font-size="12" font-weight="400">scope and overlap with wired inclusion still need a decision.</text><text x="476" y="673" fill="#a2a9b3" font-size="12" font-weight="400">Checked/unchecked states illustrate attachment choice.</text><text x="476" y="693" fill="#a2a9b3" font-size="12" font-weight="400">No global or per-Workspace checkbox scope is implied.</text><text x="45" y="744" fill="#a2a9b3" font-size="12" font-weight="400">W4  Reference nodes have their own square output pins. Proximity never includes material.</text></g></svg>