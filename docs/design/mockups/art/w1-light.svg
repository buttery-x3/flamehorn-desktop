t="400">missing people and the events between</text><text x="716" y="285" fill="#29333e" font-size="13" font-weight="400">those traces. …</text><text x="711" y="371" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="943" y="371" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="697" y="187" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="997" y="187" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><rect x="701" y="423" width="300" height="165" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M709 449 L993 449" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="710" y="441" fill="#29333e" font-size="12" font-weight="600">U2  User Context</text><text x="935" y="441" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="708" y="455" width="286" height="101" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="716" y="474" fill="#29333e" font-size="13" font-weight="400">Could the absence feel hopeful instead</text><text x="716" y="492" fill="#29333e" font-size="13" font-weight="400">of sad?</text><text x="716" y="510" fill="#29333e" font-size="13" font-weight="400"></text><text x="716" y="528" fill="#29333e" font-size="13" font-weight="400">Keep the same material; change the…</text><text x="711" y="577" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="943" y="577" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="697" y="466" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="997" y="466" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><text x="47" y="394" fill="#616d7b" font-size="11" font-weight="400">▸ Night train scenes   ·   9 objects</text><text x="40" y="431" fill="#616d7b" font-size="10" font-weight="400">REFERENCE NODES / attachment scope is still open</text><rect x="38" y="445" width="295" height="131" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="48" y="464" fill="#29333e" font-size="12" font-weight="600">F1  station.png</text><path d="M46 472 L325 472" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><rect x="45" y="478" width="281" height="66" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><rect x="53" y="485" width="65" height="51" rx="0" fill="#e5e8eb" stroke="none" stroke-width="1"/><path d="M58 529 L105 490 M70 529 L110 490" fill="none" stroke="#616d7b" stroke-width="1" stroke-dasharray=""/><text x="128" y="497" fill="#616d7b" font-size="11" font-weight="400">Image preview · empty station</text><text x="128" y="513" fill="#616d7b" font-size="11" font-weight="400">platform.</text><rect x="48" y="554" width="11" height="11" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="66" y="564" fill="#29333e" font-size="10" font-weight="400">Include as context attachment</text><rect x="329" y="488" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><rect x="38" y="593" width="295" height="114" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="48" y="612" fill="#29333e" font-size="12" font-weight="600">F2  field-notes.txt</text><path d="M46 620 L325 620" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><rect x="45" y="626" width="281" height="49" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="53" y="646" fill="#616d7b" font-size="11" font-weight="400">A bench worn smooth by years of waiting.</text><rect x="48" y="685" width="11" height="11" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="66" y="695" fill="#29333e" font-size="10" font-weight="400">Include as context attachment</text><rect x="329" y="636" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><text x="381" y="472" fill="#616d7b" font-size="10" font-weight="400">CONNECTION LEGEND</text><rect x="382" y="487" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><text x="399" y="495" fill="#29333e" font-size="12" font-weight="400">Blue square · input</text><rect x="382" y="511" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><text x="399" y="519" fill="#29333e" font-size="12" font-weight="400">Amber square · output</text><text x="381" y="549" fill="#616d7b" font-size="12" font-weight="400">Direct M4 → U2 is a user-authored</text><text x="381" y="566" fill="#616d7b" font-size="12" font-weight="400">continuation. It does not run a model.</text><text x="378" y="661" fill="#616d7b" font-size="11" font-weight="400">100% / compact text · 12–13 px</text><text x="40" y="739" fill="#616d7b" font-size="12" font-weight="400">W1  Spatial A1 structure retained. Sharp Context cards; rounded rectangular Processes.</text><rect x="1050" y="77" width="290" height="705" rx="0" fill="#eceef0" stroke="none" stroke-width="1"/><path d="M1058 105 L1332 105" fill="none" stroke="#b1bac5" stroke-width="0.7" stroke-dasharray=""/><text x="1060" y="96" fill="#29333e" font-size="11" font-weight="600">INSPECTOR  /  M4</text><path d="M1058 138 L1332 138" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><path d="M1066 138 L1116 138" fill="none" stroke="#0875b9" stroke-width="1.8" stroke-dasharray=""/><text x="1066" y="130" fill="#29333e" font-size="12" font-weight="400">Content</text><text x="1143" y="130" fill="#616d7b" font-size="12" font-weight="400">Generation</text><text x="1283" y="130" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="1058" y="146" width="274" height="255" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="1068" y="166" fill="#29333e" font-size="13" font-weight="400">An abandoned place leaves evidence</text><text x="1068" y="184" fill="#29333e" font-size="13" font-weight="400">without explanation. A cup on a sill</text><text x="1068" y="202" fill="#29333e" font-size="13" font-weight="400">suggests a habit; an empty doorway</text><text x="1068" y="220" fill="#29333e" font-size="13" font-weight="400">suggests a departure.</text><text x="1068" y="238" fill="#29333e" font-size="13" font-weight="400"></text><text x="1068" y="256" fill="#29333e" font-size="13" font-weight="400">We supply the missing people and the</text><text x="1068" y="274" fill="#29333e" font-size="13" font-weight="400">events between those traces. The</text><text x="1068" y="292" fill="#29333e" font-size="13" font-weight="400">incompleteness invites us to become</text><text x="1068" y="310" fill="#29333e" font-size="13" font-weight="400">storytellers.</text><text x="1066" y="426" fill="#616d7b" font-size="9" font-weight="400">SELECTED VERSION</text><text x="1065" y="456" fill="#616d7b" font-size="11" font-weight="400">Content</text><text x="1149" y="456" fill="#29333e" font-size="12" font-weight="400">M4 · v1</text><text x="1065" y="488" fill="#616d7b" font-size="11" font-weight="400">Generated by</text><text x="1149" y="488" fill="#29333e" font-size="12" font-weight="400">Respond / R1</text><text x="1065" y="520" fill="#616d7b" font-size="11" font-weight="400">Input used</text><text x="1149" y="520" fill="#29333e" font-size="12" font-weight="400">U1 · v1</text><text x="1065" y="552" fill="#616d7b" font-size="11" font-weight="400">Persona used</text><text x="1149" y="552" fill="#29333e" font-size="12" font-weight="400">None</text><path d="M1058 568 L1332 568" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="1067" y="596" fill="#616d7b" font-size="12" font-weight="400">R1 used None.</text><text x="1067" y="613" fill="#616d7b" font-size="12" font-weight="400">P1 now uses Gambling Cowboy.</text><text x="1067" y="630" fill="#616d7b" font-size="12" font-weight="400"></text><text x="1067" y="647" fill="#616d7b" font-size="12" font-weight="400">Reading does not change inputs.</text><text x="1067" y="664" fill="#616d7b" font-size="12" font-weight="400">Persona and Run stay on Process.</text><text x="1060" y="752" fill="#616d7b" font-size="9" font-weight="400">FULL CONTENT, AT ANY ZOOM</text></g></svg>