<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">D1 one Explode with four populated Model Context outputs, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#d8dce0" stroke="#d8dce0" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#e0e4e8" stroke="#b1bac5" stroke-width="1"/><text x="13" y="21" fill="#29333e" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#616d7b" font-size="11" font-weight="400">Branch and extract</text><text x="1130" y="21" fill="#616d7b" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#616d7b" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#eceef0" stroke="#b1bac5" stroke-width="1"/><text x="15" y="52" fill="#616d7b" font-size="11" font-weight="400">Desktop  /  Branch and extract</text><text x="475" y="52" fill="#616d7b" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#e0e4e8" stroke="#b1bac5" stroke-width="1"/><text x="14" y="821" fill="#616d7b" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#616d7b" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1320" height="705" rx="3" fill="#e5e8eb" stroke="none" stroke-width="1"/><path d="M28 102 L1328 102" fill="none" stroke="#b8c1cb" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#616d7b" font-size="10" font-weight="400">CONVERSATION WORKSPACE  /  one Explode, four destinations</text><text x="1308" y="94" fill="#616d7b" font-size="12" font-weight="400">⋯</text><rect x="38" y="160" width="254" height="207" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M46 186 L284 186" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="47" y="178" fill="#29333e" font-size="12" font-weight="600">U1  User Context</text><text x="226" y="178" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="45" y="192" width="240" height="143" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="53" y="211" fill="#29333e" font-size="13" font-weight="400">Why do abandoned places feel</text><text x="53" y="229" fill="#29333e" font-size="13" font-weight="400">full of stories?</text><text x="53" y="247" fill="#29333e" font-size="13" font-weight="400"></text><text x="53" y="265" fill="#29333e" font-size="13" font-weight="400">Start with the emotional feeling,</text><text x="53" y="283" fill="#29333e" font-size="13" font-weight="400">then look at the objects we leave</text><text x="53" y="301" fill="#29333e" font-size="13" font-weight="400">behind.</text><text x="48" y="356" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="234" y="356" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="34" y="203" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="288" y="203" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M292 207 C323.5 207 323.5 257 355 257" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M348 254 L355 257 L348 260" fill="none" stroke="#1483b7"/><rect x="355" y="194" width="231" height="146" rx="9" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="367" y="214" fill="#29333e" font-size="13" font-weight="600">Explode</text><text x="367" y="231" fill="#616d7b" font-size="9" font-weight="400">P2  PROCESS</text><text x="547" y="220" fill="#29333e" font-size="17" font-weight="400">∅</text><text x="569" y="219" fill="#616d7b" font-size="10" font-weight="400">⌄</text><text x="370" y="258" fill="#616d7b" font-size="11" font-weight="400">Tone</text><text x="454" y="258" fill="#29333e" font-size="12" font-weight="400">Exploratory  ⌄</text><path d="M367 303 L574 303" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="371" y="293" fill="#616d7b" font-size="11" font-weight="400">1 input → 4 targets</text><rect x="363" y="309" width="70" height="23" rx="3" fill="#d3e7f6" stroke="none" stroke-width="1"/><text x="372" y="325" fill="#29333e" font-size="11" font-weight="400">▶ Run</text><text x="521" y="325" fill="#616d7b" font-size="10" font-weight="400">Completed</text><rect x="351" y="253" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="582" y="253" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M586 257 C622.5 257 622.5 183 659 183" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M652 180 L659 183 L652 186" fill="none" stroke="#1483b7"/><rect x="659" y="136" width="289" height="242" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M667 162 L940 162" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="668" y="154" fill="#29333e" font-size="12" font-weight="600">M5  Model Context</text><text x="882" y="154" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="666" y="168" width="275" height="178" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="674" y="187" fill="#29333e" font-size="13" font-weight="400">Objects as witnesses</text><text x="674" y="205" fill="#29333e" font-size="13" font-weight="400"></text><text x="674" y="223" fill="#29333e" font-size="13" font-weight="400">A cup, a ticket and a worn stair</text><text x="674" y="241" fill="#29333e" font-size="13" font-weight="400">remember repeated gestures. Follow</text><text x="674" y="259" fill="#29333e" font-size="13" font-weight="400">one object and imagine the hands that</text><text x="674" y="277" fill="#29333e" font-size="13" font-weight="400">used it.</text><text x="669" y="367" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="890" y="367" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="655" y="179" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="944" y="179" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M586 257 L620 257 L620 112 L975 112 L975 183 L992 183" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M985 180 L992 183 L985 186" fill="none" stroke="#1483b7"/><rect x="992" y="136" width="309" height="242" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M1000 162 L1293 162" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="1001" y="154" fill="#29333e" font-size="12" font-weight="600">M6  Model Context</text><text x="1235" y="154" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="999" y="168" width="295" height="178" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="1007" y="187" fill="#29333e" font-size="13" font-weight="400">Nature takes the lead</text><text x="1007" y="205" fill="#29333e" font-size="13" font-weight="400"></text><text x="1007" y="223" fill="#29333e" font-size="13" font-weight="400">Vines turn doorways into gardens and rain</text><text x="1007" y="241" fill="#29333e" font-size="13" font-weight="400">edits painted signs. Tell the story through</text><text x="1007" y="259" fill="#29333e" font-size="13" font-weight="400">what grows back.</text><text x="1002" y="367" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="1243" y="367" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="988" y="179" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="1297" y="179" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M586 257 C622.5 257 622.5 478 659 478" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M652 475 L659 478 L652 481" fill="none" stroke="#1483b7"/><rect x="659" y="431" width="289" height="242" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M667 457 L940 457" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="668" y="449" fill="#29333e" font-size="12" font-weight="600">M7  Model Context</text><text x="882" y="449" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="666" y="463" width="275" height="178" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="674" y="482" fill="#29333e" font-size="13" font-weight="400">A hopeful departure</text><text x="674" y="500" fill="#29333e" font-size="13" font-weight="400"></text><text x="674" y="518" fill="#29333e" font-size="13" font-weight="400">An empty home can mark escape,</text><text x="674" y="536" fill="#29333e" font-size="13" font-weight="400">opportunity or a journey completed.</text><text x="674" y="554" fill="#29333e" font-size="13" font-weight="400">Let absence signal a beginning.</text><text x="669" y="662" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="890" y="662" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="655" y="474" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="944" y="474" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M586 257 L620 257 L620 721 L975 721 L975 478 L992 478" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M985 475 L992 478 L985 481" fill="none" stroke="#1483b7"/><rect x="992" y="431" width="309" height="242" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M1000 457 L1293 457" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="1001" y="449" fill="#29333e" font-size="12" font-weight="600">M8  Model Context</text><text x="1235" y="449" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="999" y="463" width="295" height="178" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="1007" y="482" fill="#29333e" font-size="13" font-weight="400">The unreliable visitor</text><text x="1007" y="500" fill="#29333e" font-size="13" font-weight="400"></text><text x="1007" y="518" fill="#29333e" font-size="13" font-weight="400">A visitor invents a life from three clues.</text><text x="1007" y="536" fill="#29333e" font-size="13" font-weight="400">Let each new detail undo the story they</text><text x="1007" y="554" fill="#29333e" font-size="13" font-weight="400">were certain was true.</text><text x="1002" y="662" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="1243" y="662" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="988" y="474" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="1297" y="474" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><text x="49" y="484" fill="#616d7b" font-size="11" font-weight="400">▸ Night train scenes · unrelated</text><rect x="40" y="514" width="269" height="149" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="50" y="533" fill="#29333e" font-size="12" font-weight="600">F1  station.png</text><path d="M48 541 L301 541" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><rect x="47" y="547" width="255" height="84" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><rect x="55" y="554" width="65" height="69" rx="0" fill="#e5e8eb" stroke="none" stroke-width="1"/><path d="M60 616 L107 559 M72 616 L112 559" fill="none" stroke="#616d7b" stroke-width="1" stroke-dasharray=""/><text x="130" y="566" fill="#616d7b" font-size="11" font-weight="400">Image preview. No wire to</text><text x="130" y="582" fill="#616d7b" font-size="11" font-weight="400">this run.</text><rect x="50" y="641" width="11" height="11" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="68" y="651" fill="#29333e" font-size="10" font-weight="400">Include as context attachment</text><rect x="305" y="557" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><text x="354" y="514" fill="#616d7b" font-size="12" font-weight="400">One Run fills all four targets, then stops.</text><text x="354" y="533" fill="#616d7b" font-size="12" font-weight="400"></text><text x="354" y="552" fill="#616d7b" font-size="12" font-weight="400">No prompt-direction nodes or extra user</text><text x="354" y="571" fill="#616d7b" font-size="12" font-weight="400">steps are exposed.</text><text x="354" y="590" fill="#616d7b" font-size="12" font-weight="400"></text><text x="354" y="609" fill="#616d7b" font-size="12" font-weight="400">Counts, mismatches and partial failures</text><text x="354" y="628" fill="#616d7b" font-size="12" font-weight="400">remain open.</text><text x="40" y="751" fill="#616d7b" font-size="12" font-weight="400">D1  Explode results are ordinary Model Contexts. No downstream Process runs automatically.</text></g></svg>