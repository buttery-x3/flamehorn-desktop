<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">B5 running state, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#d8dce0" stroke="#d8dce0" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#e0e4e8" stroke="#b1bac5" stroke-width="1"/><text x="13" y="21" fill="#29333e" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#616d7b" font-size="11" font-weight="400">Running / one execution</text><text x="1130" y="21" fill="#616d7b" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#616d7b" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#eceef0" stroke="#b1bac5" stroke-width="1"/><text x="15" y="52" fill="#616d7b" font-size="11" font-weight="400">Desktop  /  Running / one execution</text><text x="475" y="52" fill="#616d7b" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#e0e4e8" stroke="#b1bac5" stroke-width="1"/><text x="14" y="821" fill="#616d7b" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#616d7b" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1014" height="705" rx="3" fill="#e5e8eb" stroke="none" stroke-width="1"/><path d="M28 102 L1022 102" fill="none" stroke="#b8c1cb" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#616d7b" font-size="10" font-weight="400">CONVERSATION WORKSPACE  /  Story seeds</text><text x="1002" y="94" fill="#616d7b" font-size="12" font-weight="400">⋯</text><text x="40" y="733" fill="#29333e" font-size="12" font-weight="600">B5  Running / one execution</text><rect x="42" y="157" width="290" height="193" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M50 183 L324 183" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="51" y="175" fill="#29333e" font-size="12" font-weight="600">U1  User Context</text><text x="266" y="175" fill="#616d7b" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="49" y="189" width="276" height="129" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="57" y="208" fill="#29333e" font-size="13" font-weight="400">Why do abandoned places feel full of</text><text x="57" y="226" fill="#29333e" font-size="13" font-weight="400">stories?</text><text x="57" y="244" fill="#29333e" font-size="13" font-weight="400"></text><text x="57" y="262" fill="#29333e" font-size="13" font-weight="400">Start with the emotional feeling, then</text><text x="57" y="280" fill="#29333e" font-size="13" font-weight="400">look at the objects we leave behind.</text><text x="52" y="339" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="274" y="339" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="38" y="200" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="328" y="200" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M332 204 C366.5 204 366.5 237 401 237" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M394 234 L401 237 L394 240" fill="none" stroke="#1483b7"/><rect x="401" y="174" width="230" height="146" rx="9" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><text x="413" y="194" fill="#29333e" font-size="13" font-weight="600">Respond</text><text x="413" y="211" fill="#616d7b" font-size="9" font-weight="400">P1  PROCESS</text><text x="592" y="200" fill="#29333e" font-size="17" font-weight="400">∅</text><text x="614" y="199" fill="#616d7b" font-size="10" font-weight="400">⌄</text><text x="416" y="238" fill="#616d7b" font-size="11" font-weight="400">Tone</text><text x="500" y="238" fill="#29333e" font-size="12" font-weight="400">Reflective  ⌄</text><path d="M413 283 L619 283" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="417" y="273" fill="#616d7b" font-size="11" font-weight="400">1 input → 1 target</text><rect x="409" y="289" width="92" height="23" rx="3" fill="#d3e7f6" stroke="none" stroke-width="1"/><text x="418" y="305" fill="#29333e" font-size="11" font-weight="400">Running…</text><text x="566" y="305" fill="#616d7b" font-size="10" font-weight="400">Running</text><rect x="397" y="233" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="627" y="233" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M631 237 C667.5 237 667.5 204 704 204" fill="none" stroke="#616d7b" stroke-width="1.6" stroke-dasharray=""/><path d="M697 201 L704 204 L697 207" fill="none" stroke="#1483b7"/><rect x="704" y="157" width="300" height="230" rx="0" fill="#f4f5f6" stroke="#b1bac5" stroke-width="1"/><path d="M712 183 L996 183" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="713" y="175" fill="#29333e" font-size="12" font-weight="600">M4  Model Context</text><text x="938" y="175" fill="#616d7b" font-size="11" font-weight="400">‹ — ›</text><rect x="711" y="189" width="286" height="166" rx="0" fill="#fff" stroke="#b1bac5" stroke-width="1"/><text x="719" y="208" fill="#29333e" font-size="13" font-weight="400">Receiving result…</text><text x="719" y="226" fill="#29333e" font-size="13" font-weight="400"></text><text x="719" y="244" fill="#29333e" font-size="13" font-weight="400">Final content is not available in this still.</text><text x="714" y="376" fill="#616d7b" font-size="9" font-weight="400">CONTEXT</text><text x="946" y="376" fill="#616d7b" font-size="15" font-weight="400">⋯</text><rect x="700" y="200" width="8" height="8" rx="0" fill="#1483b7" stroke="#1483b7" stroke-width="1"/><rect x="1000" y="200" width="8" height="8" rx="0" fill="#b67a0b" stroke="#b67a0b" stroke-width="1"/><path d="M44 472 L991 472" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="44" y="496" fill="#29333e" font-size="11" font-weight="600">One Process is active.</text><text x="44" y="520" fill="#616d7b" font-size="13" font-weight="400">No downstream Process starts automatically. This is a static illustration, not a live request.</text><rect x="1050" y="77" width="290" height="705" rx="0" fill="#eceef0" stroke="none" stroke-width="1"/><text x="1064" y="99" fill="#29333e" font-size="11" font-weight="600">REVIEW NOTES</text><path d="M1062 111 L1328 111" fill="none" stroke="#b1bac5" stroke-width="0.6" stroke-dasharray=""/><text x="1064" y="138" fill="#29333e" font-size="11" font-weight="600">Visible state</text><text x="1064" y="162" fill="#616d7b" font-size="12" font-weight="400">Respond is running; M4 is not yet a</text><text x="1064" y="180" fill="#616d7b" font-size="12" font-weight="400">completed version.</text><text x="1064" y="253" fill="#29333e" font-size="11" font-weight="600">Open decisions</text><text x="1064" y="277" fill="#616d7b" font-size="12" font-weight="400">Streaming presentation, progress</text><text x="1064" y="295" fill="#616d7b" font-size="12" font-weight="400">indicators and cancellation details are not</text><text x="1064" y="313" fill="#616d7b" font-size="12" font-weight="400">settled.</text><text x="1064" y="368" fill="#29333e" font-size="11" font-weight="600">No autonomous chain</text><text x="1064" y="392" fill="#616d7b" font-size="12" font-weight="400">When this run finishes, execution stops.</text></g></svg>