<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">B2 Process missing destination with explained unavailable Run, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#181a1e" stroke="#181a1e" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="13" y="21" fill="#dedfe3" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#a2a9b3" font-size="11" font-weight="400">Respond created / missing destination</text><text x="1130" y="21" fill="#a2a9b3" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#a2a9b3" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#25282e" stroke="#454c57" stroke-width="1"/><text x="15" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Desktop  /  Respond created / missing destination</text><text x="475" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="14" y="821" fill="#a2a9b3" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#a2a9b3" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1014" height="705" rx="3" fill="#202328" stroke="none" stroke-width="1"/><path d="M28 102 L1022 102" fill="none" stroke="#343b44" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#a2a9b3" font-size="10" font-weight="400">CONVERSATION WORKSPACE  /  Story seeds</text><text x="1002" y="94" fill="#a2a9b3" font-size="12" font-weight="400">⋯</text><text x="40" y="733" fill="#dedfe3" font-size="12" font-weight="600">B2  Respond created / missing destination</text><rect x="42" y="157" width="290" height="193" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M50 183 L324 183" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="51" y="175" fill="#dedfe3" font-size="12" font-weight="600">U1  User Context</text><text x="266" y="175" fill="#a2a9b3" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="49" y="189" width="276" height="129" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="57" y="208" fill="#dedfe3" font-size="13" font-weight="400">Why do abandoned places feel full of</text><text x="57" y="226" fill="#dedfe3" font-size="13" font-weight="400">stories?</text><text x="57" y="244" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="57" y="262" fill="#dedfe3" font-size="13" font-weight="400">Start with the emotional feeling, then</text><text x="57" y="280" fill="#dedfe3" font-size="13" font-weight="400">look at the objects we leave behind.</text><text x="52" y="339" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="274" y="339" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="38" y="200" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="328" y="200" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><path d="M332 204 C366.5 204 366.5 237 401 237" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M394 234 L401 237 L394 240" fill="none" stroke="#56b8e9"/><rect x="401" y="174" width="230" height="146" rx="9" fill="#292d33" stroke="#454c57" stroke-width="1"/><text x="413" y="194" fill="#dedfe3" font-size="13" font-weight="600">Respond</text><text x="413" y="211" fill="#a2a9b3" font-size="9" font-weight="400">P1  PROCESS</text><text x="592" y="200" fill="#dedfe3" font-size="17" font-weight="400">∅</text><text x="614" y="199" fill="#a2a9b3" font-size="10" font-weight="400">⌄</text><text x="416" y="238" fill="#a2a9b3" font-size="11" font-weight="400">Tone</text><text x="500" y="238" fill="#dedfe3" font-size="12" font-weight="400">Reflective  ⌄</text><path d="M413 283 L619 283" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="417" y="273" fill="#a2a9b3" font-size="11" font-weight="400">1 input → 0 targets</text><rect x="409" y="289" width="110" height="23" rx="3" fill="#2c3037" stroke="none" stroke-width="1"/><text x="418" y="305" fill="#dedfe3" font-size="11" font-weight="400">Run unavailable</text><text x="566" y="305" fill="#a2a9b3" font-size="10" font-weight="400">No output</text><rect x="397" y="233" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="627" y="233" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><text x="687" y="218" fill="#dedfe3" font-size="13" font-weight="600">Connect an output to run</text><text x="687" y="243" fill="#a2a9b3" font-size="13" font-weight="400">Drag Respond’s amber output pin to create a</text><text x="687" y="261" fill="#a2a9b3" font-size="13" font-weight="400">Model Context destination.</text><path d="M44 472 L991 472" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="44" y="496" fill="#dedfe3" font-size="11" font-weight="600">Run is visibly unavailable, with an explanation.</text><text x="44" y="520" fill="#a2a9b3" font-size="13" font-weight="400">Creating the Process configured an action. It did not create a result or invoke a model.</text><rect x="1050" y="77" width="290" height="705" rx="0" fill="#25282e" stroke="none" stroke-width="1"/><text x="1064" y="99" fill="#dedfe3" font-size="11" font-weight="600">REVIEW NOTES</text><path d="M1062 111 L1328 111" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="1064" y="138" fill="#dedfe3" font-size="11" font-weight="600">After B1</text><text x="1064" y="162" fill="#a2a9b3" font-size="12" font-weight="400">Respond exists and is wired to U1.</text><text x="1064" y="253" fill="#dedfe3" font-size="11" font-weight="600">Missing target</text><text x="1064" y="277" fill="#a2a9b3" font-size="12" font-weight="400">A Process needs a valid output destination</text><text x="1064" y="295" fill="#a2a9b3" font-size="12" font-weight="400">before Run is available.</text><text x="1064" y="368" fill="#dedfe3" font-size="11" font-weight="600">No unexplained disabled control</text><text x="1064" y="392" fill="#a2a9b3" font-size="12" font-weight="400">The nearby instruction identifies the next</text><text x="1064" y="410" fill="#a2a9b3" font-size="12" font-weight="400">required step.</text></g></svg>