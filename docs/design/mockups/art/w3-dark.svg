<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">W3 two inputs into one Merge Process with square colored pins, dark, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#181a1e" stroke="#181a1e" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="13" y="21" fill="#dedfe3" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#a2a9b3" font-size="11" font-weight="400">Multi-input / Merge</text><text x="1130" y="21" fill="#a2a9b3" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#a2a9b3" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#25282e" stroke="#454c57" stroke-width="1"/><text x="15" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Desktop  /  Multi-input / Merge</text><text x="475" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="14" y="821" fill="#a2a9b3" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#a2a9b3" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1319" height="699" rx="3" fill="#202328" stroke="none" stroke-width="1"/><path d="M28 102 L1327 102" fill="none" stroke="#343b44" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#a2a9b3" font-size="10" font-weight="400">CONVERSATION WORKSPACE  /  selected inputs, one Process, one output</text><text x="1307" y="94" fill="#a2a9b3" font-size="12" font-weight="400">⋯</text><path d="M350 184 L410 184 L410 285 L493 285" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M486 282 L493 285 L486 288" fill="none" stroke="#56b8e9"/><path d="M350 454 L438 454 L438 324 L493 324" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M486 321 L493 324 L486 327" fill="none" stroke="#56b8e9"/><path d="M753 285 C811.0 285 811.0 285 869 285" fill="none" stroke="#a2a9b3" stroke-width="1.6" stroke-dasharray=""/><path d="M862 282 L869 285 L862 288" fill="none" stroke="#56b8e9"/><rect x="45" y="137" width="305" height="209" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M53 163 L342 163" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="54" y="155" fill="#dedfe3" font-size="12" font-weight="600">U1  User Context</text><text x="284" y="155" fill="#a2a9b3" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="52" y="169" width="291" height="145" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="60" y="188" fill="#dedfe3" font-size="13" font-weight="400">Why do abandoned places feel full of</text><text x="60" y="206" fill="#dedfe3" font-size="13" font-weight="400">stories?</text><text x="60" y="224" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="60" y="242" fill="#dedfe3" font-size="13" font-weight="400">Start with the emotional feeling, then</text><text x="60" y="260" fill="#dedfe3" font-size="13" font-weight="400">look at the objects we leave behind.</text><text x="55" y="335" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="292" y="335" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="41" y="180" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="346" y="180" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><rect x="45" y="407" width="305" height="209" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M53 433 L342 433" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="54" y="425" fill="#dedfe3" font-size="12" font-weight="600">U3  User Context</text><text x="284" y="425" fill="#a2a9b3" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="52" y="439" width="291" height="145" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="60" y="458" fill="#dedfe3" font-size="13" font-weight="400">A second lens: abandonment can also</text><text x="60" y="476" fill="#dedfe3" font-size="13" font-weight="400">mean escape, opportunity or a chapter</text><text x="60" y="494" fill="#dedfe3" font-size="13" font-weight="400">completed.</text><text x="60" y="512" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="60" y="530" fill="#dedfe3" font-size="13" font-weight="400">Avoid assuming that every departure is a</text><text x="60" y="548" fill="#dedfe3" font-size="13" font-weight="400">tragedy.</text><text x="55" y="605" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="292" y="605" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="41" y="450" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="346" y="450" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><rect x="493" y="222" width="260" height="166" rx="9" fill="#292d33" stroke="#318bd4" stroke-width="1.4"/><text x="505" y="242" fill="#dedfe3" font-size="13" font-weight="600">Merge</text><text x="505" y="259" fill="#a2a9b3" font-size="9" font-weight="400">P2  PROCESS</text><image x="714" y="231" width="19" height="19" href="data:image/png;base64,"/><text x="736" y="247" fill="#a2a9b3" font-size="10" font-weight="400">⌄</text><text x="508" y="286" fill="#a2a9b3" font-size="11" font-weight="400">Tone</text><text x="592" y="286" fill="#dedfe3" font-size="12" font-weight="400">Reflective  ⌄</text><path d="M505 351 L741 351" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="509" y="341" fill="#a2a9b3" font-size="11" font-weight="400">2 inputs → 1 target</text><rect x="501" y="357" width="70" height="23" rx="3" fill="#073f64" stroke="none" stroke-width="1"/><text x="510" y="373" fill="#dedfe3" font-size="11" font-weight="400">▶ Run</text><text x="688" y="373" fill="#a2a9b3" font-size="10" font-weight="400">Ready</text><rect x="489" y="281" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="749" y="281" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><rect x="489" y="320" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="869" y="238" width="420" height="299" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M877 264 L1281 264" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="878" y="256" fill="#dedfe3" font-size="12" font-weight="600">M9  Model Context</text><text x="1223" y="256" fill="#a2a9b3" font-size="11" font-weight="400">‹ — ›</text><rect x="876" y="270" width="406" height="235" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="884" y="289" fill="#dedfe3" font-size="13" font-weight="400">Awaiting first run.</text><text x="884" y="307" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="884" y="325" fill="#dedfe3" font-size="13" font-weight="400">This connected Model Context is the destination for Merge.</text><text x="884" y="343" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="884" y="361" fill="#dedfe3" font-size="13" font-weight="400">Two selected inputs feed one Process. Pressing Run would</text><text x="884" y="379" fill="#dedfe3" font-size="13" font-weight="400">fill this single target and then stop.</text><text x="879" y="526" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="1231" y="526" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="865" y="281" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="1285" y="281" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><path d="M481 541 L764 541" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="481" y="535" fill="#a2a9b3" font-size="10" font-weight="400">P2 / INPUTS</text><text x="488" y="567" fill="#a2a9b3" font-size="11" font-weight="400">01  U1</text><text x="572" y="567" fill="#dedfe3" font-size="12" font-weight="400">version 1</text><text x="488" y="599" fill="#a2a9b3" font-size="11" font-weight="400">02  U3</text><text x="572" y="599" fill="#dedfe3" font-size="12" font-weight="400">version 1</text><text x="481" y="644" fill="#a2a9b3" font-size="12" font-weight="400">Two distinct blue input pins. The labels show</text><text x="481" y="661" fill="#a2a9b3" font-size="12" font-weight="400">their sources; detailed context-order policy is</text><text x="481" y="678" fill="#a2a9b3" font-size="12" font-weight="400">still open.</text><text x="882" y="602" fill="#a2a9b3" font-size="10" font-weight="400">OUTPUT CONTRACT</text><text x="882" y="626" fill="#a2a9b3" font-size="12" font-weight="400">One amber output pin → M9.</text><text x="882" y="645" fill="#a2a9b3" font-size="12" font-weight="400">No output is generated just by connecting nodes.</text><text x="882" y="664" fill="#a2a9b3" font-size="12" font-weight="400">Run lives on Merge, never on the Context cards.</text><text x="45" y="744" fill="#a2a9b3" font-size="12" font-weight="400">W3  Merge is a visual multi-input example, not a decision to include it in the MVP Process set.</text></g></svg>