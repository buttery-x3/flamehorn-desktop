<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title"><title id="title">B1 source-pin creation palette, Draft</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1360" height="830" rx="0" fill="#181a1e" stroke="#181a1e" stroke-width="1"/><rect x="0" y="0" width="1360" height="32" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="13" y="21" fill="#dedfe3" font-size="12" font-weight="600">✳  FLAMEHORN DESKTOP</text><text x="235" y="21" fill="#a2a9b3" font-size="11" font-weight="400">Drag a source pin / choose Respond</text><text x="1130" y="21" fill="#a2a9b3" font-size="11" font-weight="400">＋ Create / actions</text><text x="1283" y="21" fill="#a2a9b3" font-size="11" font-weight="400">⚙</text><rect x="0" y="33" width="1360" height="28" rx="0" fill="#25282e" stroke="#454c57" stroke-width="1"/><text x="15" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Desktop  /  Drag a source pin / choose Respond</text><text x="475" y="52" fill="#a2a9b3" font-size="11" font-weight="400">Freeform  ▾    │    100%  −  +</text><rect x="0" y="803" width="1360" height="27" rx="0" fill="#2c3037" stroke="#454c57" stroke-width="1"/><text x="14" y="821" fill="#a2a9b3" font-size="11" font-weight="400">⌂ Desktop    │    ● Story seeds    │    ▤ References    │    ＋</text><text x="990" y="821" fill="#a2a9b3" font-size="10" font-weight="400">DRAFT  ·  static artwork  ·  no inference</text><rect x="18" y="77" width="1014" height="705" rx="3" fill="#202328" stroke="none" stroke-width="1"/><path d="M28 102 L1022 102" fill="none" stroke="#343b44" stroke-width="0.7" stroke-dasharray=""/><text x="28" y="94" fill="#a2a9b3" font-size="10" font-weight="400">CONVERSATION WORKSPACE  /  Story seeds</text><text x="1002" y="94" fill="#a2a9b3" font-size="12" font-weight="400">⋯</text><text x="40" y="733" fill="#dedfe3" font-size="12" font-weight="600">B1  Drag a source pin / choose Respond</text><rect x="46" y="160" width="291" height="190" rx="0" fill="#292d33" stroke="#454c57" stroke-width="1"/><path d="M54 186 L329 186" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="55" y="178" fill="#dedfe3" font-size="12" font-weight="600">U1  User Context</text><text x="271" y="178" fill="#a2a9b3" font-size="11" font-weight="400">‹ 1/1 ›</text><rect x="53" y="192" width="277" height="126" rx="0" fill="#202328" stroke="#454c57" stroke-width="1"/><text x="61" y="211" fill="#dedfe3" font-size="13" font-weight="400">Why do abandoned places feel full of</text><text x="61" y="229" fill="#dedfe3" font-size="13" font-weight="400">stories?</text><text x="61" y="247" fill="#dedfe3" font-size="13" font-weight="400"></text><text x="61" y="265" fill="#dedfe3" font-size="13" font-weight="400">Start with the emotional feeling, then</text><text x="61" y="283" fill="#dedfe3" font-size="13" font-weight="400">look at the objects we leave behind.</text><text x="56" y="339" fill="#a2a9b3" font-size="9" font-weight="400">CONTEXT</text><text x="279" y="339" fill="#a2a9b3" font-size="15" font-weight="400">⋯</text><rect x="42" y="203" width="8" height="8" rx="0" fill="#56b8e9" stroke="#56b8e9" stroke-width="1"/><rect x="333" y="203" width="8" height="8" rx="0" fill="#e2ae51" stroke="#e2ae51" stroke-width="1"/><path d="M337 207 C419 207 453 226 520 226" fill="none" stroke="#e2ae51" stroke-width="1.5" stroke-dasharray="5 4"/><text x="362" y="189" fill="#a2a9b3" font-size="11" font-weight="400">drag into empty space</text><rect x="525" y="180" width="321" height="160" rx="2" fill="#25282e" stroke="#454c57" stroke-width="1"/><rect x="533" y="188" width="305" height="27" rx="1" fill="#202328" stroke="#318bd4" stroke-width="1"/><text x="542" y="207" fill="#a2a9b3" font-size="12" font-weight="400">Choose a Process…</text><rect x="529" y="221" width="313" height="23" rx="0" fill="#073f64" stroke="none" stroke-width="1"/><text x="540" y="237" fill="#dedfe3" font-size="12" font-weight="400">Respond</text><text x="540" y="260" fill="#dedfe3" font-size="12" font-weight="400">Continue</text><text x="540" y="283" fill="#dedfe3" font-size="12" font-weight="400">Explode</text><text x="540" y="306" fill="#dedfe3" font-size="12" font-weight="400">Challenge</text><path d="M44 472 L991 472" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="44" y="496" fill="#dedfe3" font-size="11" font-weight="600">Choosing Respond creates only a Process.</text><text x="44" y="520" fill="#a2a9b3" font-size="13" font-weight="400">The new Process is connected to U1. No Model Context destination is silently created, and no inference starts.</text><rect x="1050" y="77" width="290" height="705" rx="0" fill="#25282e" stroke="none" stroke-width="1"/><text x="1064" y="99" fill="#dedfe3" font-size="11" font-weight="600">REVIEW NOTES</text><path d="M1062 111 L1328 111" fill="none" stroke="#454c57" stroke-width="0.6" stroke-dasharray=""/><text x="1064" y="138" fill="#dedfe3" font-size="11" font-weight="600">Gesture</text><text x="1064" y="162" fill="#a2a9b3" font-size="12" font-weight="400">Drag U1’s amber output pin into empty</text><text x="1064" y="180" fill="#a2a9b3" font-size="12" font-weight="400">space.</text><text x="1064" y="253" fill="#dedfe3" font-size="11" font-weight="600">Palette placement</text><text x="1064" y="277" fill="#a2a9b3" font-size="12" font-weight="400">The compact creation palette appears</text><text x="1064" y="295" fill="#a2a9b3" font-size="12" font-weight="400">where the drag ends.</text><text x="1064" y="368" fill="#dedfe3" font-size="11" font-weight="600">Vocabulary</text><text x="1064" y="392" fill="#a2a9b3" font-size="12" font-weight="400">This shows the current Process</text><text x="1064" y="410" fill="#a2a9b3" font-size="12" font-weight="400">vocabulary, not a final MVP set.</text></g></svg>